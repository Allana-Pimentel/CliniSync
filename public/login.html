<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CliniSync — Acesso ao Painel Administrativo. Faça login para gerenciar sua clínica odontológica.">
    <!-- Open Graph (WhatsApp / Redes Sociais) -->
    <meta property="og:title" content="CliniSync — Login Admin">
    <meta property="og:description" content="Acesso ao painel administrativo da CliniSync. Gestão de clínica odontológica com gamificação.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://clinicsync-af312.web.app/og-image.png">
    <meta property="og:url" content="https://clinicsync-af312.web.app/login.html">
    <title>CliniSync - Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-color), #F4E8E8);
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .login-card {
            background: var(--surface-color);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .login-header {
            margin-bottom: 30px;
        }
        .login-header i {
            font-size: 56px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            font-size: 15px;
            transition: var(--transition);
            background-color: var(--bg-color);
            color: var(--text-primary);
        }
        .input-group input:focus {
            border-color: var(--primary-color);
            background-color: var(--surface-color);
            box-shadow: 0 0 0 4px rgba(221, 167, 165, 0.15);
        }
        #login-error {
            display: none;
            color: var(--danger-color);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            background: #FEF2F2;
            padding: 10px;
            border-radius: var(--radius-md);
            border: 1px solid #FECACA;
        }
        .btn-login {
            width: 100%;
            justify-content: center;
            margin-bottom: 20px;
        }
        .back-link {
            color: var(--text-secondary);
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--primary-color);
        }
        @keyframes modalPop {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="ph-duotone ph-shield-check"></i>
            <h1>Painel Admin</h1>
            <p>CliniSync Gestão</p>
        </div>

        <div id="login-error">
            <i class="ph ph-warning-circle"></i> Usuário ou senha incorretos.
        </div>

        <div class="input-group">
            <label for="admin-user">Usuário</label>
            <input type="text" id="admin-user" placeholder="Digite seu usuário" autocomplete="off" autofocus>
        </div>
        <div class="input-group" style="margin-bottom: 24px;">
            <label for="admin-pass">Senha</label>
            <input type="password" id="admin-pass" placeholder="Digite sua senha" autocomplete="off">
        </div>

        <button id="btn-login-admin" class="btn-primary btn-login" aria-label="Entrar no painel administrativo">
            Entrar no Sistema <i class="ph ph-arrow-right"></i>
        </button>

        <a href="index.html" class="back-link">
            <i class="ph ph-arrow-left"></i> Voltar ao Portal do Cliente
        </a>
    </div>

    <script>
        document.getElementById('btn-login-admin').addEventListener('click', () => {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errorDiv = document.getElementById('login-error');

            if (user === 'admin' && pass === 'admin') {
                sessionStorage.setItem('admin_logged', 'true');
                window.location.href = 'admin.html';
            } else {
                errorDiv.style.display = 'block';
            }
        });

        // Permitir login com Enter
        document.getElementById('admin-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('btn-login-admin').click();
            }
        });
    </script>
</body>
</html>
